<!-- Fonts: Sora (display / command-center headers) · JetBrains Mono (data readouts) · Inter (body/labels) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-deep:#0A0716;
    --bg-panel:#160C2C;
    --bg-panel-2:#1D1138;
    --purple:#7C3AED;
    --purple-2:#9D6BFF;
    --purple-line: rgba(157,107,255,0.25);
    --gold:#E8B93E;
    --gold-bright:#F6D671;
    --green:#34D399;
    --red:#F87171;
    --text-hi:#F3EFFF;
    --text-mid:#B3A9D6;
    --text-low:#6E6390;
  }
  html,body{ background:var(--bg-deep); color:var(--text-hi); font-family:'Inter',sans-serif; }
  .font-display{ font-family:'Sora',sans-serif; }
  .font-mono{ font-family:'JetBrains Mono',monospace; }

  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(124,58,237,0.20), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(232,185,62,0.10), transparent 55%),
      var(--bg-deep);
  }

  .panel{
    background: linear-gradient(180deg, var(--bg-panel-2) 0%, var(--bg-panel) 100%);
    border: 1px solid var(--purple-line);
    border-radius: 14px;
    position: relative;
  }
  .panel::before{
    content:"";
    position:absolute; inset:0; border-radius:14px; padding:1px;
    background: linear-gradient(135deg, rgba(157,107,255,0.35), rgba(232,185,62,0.15) 40%, transparent 70%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events:none;
  }

  .eyebrow{ letter-spacing:.18em; font-size:11px; color:var(--text-mid); text-transform:uppercase; }

  /* live pulse dot */
  .pulse-dot{ width:8px; height:8px; border-radius:9999px; background:var(--green); position:relative; }
  .pulse-dot::after{
    content:""; position:absolute; inset:-6px; border-radius:9999px;
    border:1px solid var(--green); animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{ 0%{ transform:scale(.4); opacity:.9;} 100%{ transform:scale(1.8); opacity:0;} }

  /* gold scan line across header */
  .scan-line{
    position:absolute; top:0; left:-30%; width:30%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(246,214,113,0.10), transparent);
    animation: scan 6s linear infinite;
    pointer-events:none;
  }
  @keyframes scan{ 0%{ left:-30%; } 100%{ left:110%; } }

  .kpi-val{ font-variant-numeric: tabular-nums; }
  .up{ color:var(--green); }
  .down{ color:var(--red); }
  .flat{ color:var(--text-mid); }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--purple-line); border-radius:8px; }

  .flash-update{ animation: flashUpdate 900ms ease-out; }
  @keyframes flashUpdate{
    0%{ box-shadow: 0 0 0 1px var(--gold-bright), 0 0 24px rgba(246,214,113,0.35); }
    100%{ box-shadow: 0 0 0 0 rgba(246,214,113,0); }
  }

  .rank-badge{
    width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
  }
  .rank-1{ background:linear-gradient(135deg,var(--gold-bright),var(--gold)); color:#241705; }
  .rank-2{ background:rgba(179,169,214,0.18); color:var(--text-hi); border:1px solid rgba(179,169,214,0.35); }
  .rank-3{ background:rgba(232,185,62,0.14); color:var(--gold-bright); border:1px solid rgba(232,185,62,0.35); }
  .rank-n{ background:rgba(255,255,255,0.04); color:var(--text-mid); border:1px solid rgba(255,255,255,0.06); }

  .progress-track{ background: rgba(255,255,255,0.06); border-radius:9999px; overflow:hidden; }
  .progress-fill{ background: linear-gradient(90deg, var(--purple), var(--gold-bright)); transition: width 900ms ease; }

  table.perf thead th{ color:var(--text-mid); font-weight:600; font-size:11px; letter-spacing:.05em; text-transform:uppercase; }
  table.perf thead th.sort-th{ cursor:pointer; user-select:none; }
  table.perf thead th.sort-th:hover{ color:var(--text-hi); }
  table.perf tbody tr{ border-top:1px solid rgba(255,255,255,0.05); }
  table.perf tbody tr:hover{ background: rgba(157,107,255,0.06); }
  .cell-trend{ font-size:10px; font-family:'JetBrains Mono',monospace; margin-top:2px; }

  .status-dot{ width:6px; height:6px; border-radius:9999px; display:inline-block; margin-right:6px; }
  .status-active{ background:var(--green); }
  .status-idle{ background:var(--text-low); }
  .status-paused{ background:var(--gold); }
  .status-ended{ background:var(--text-low); }

  .filter-input{
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--purple-line);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-hi);
    color-scheme: dark;
  }
  .filter-input:focus{ outline: 1px solid var(--purple-2); }
</style>
</head>

  if (val === null || val === undefined) return "--";
  switch(type){

    case "currency2": return "RM " + Number(val).toLocaleString("en-MY", {minimumFractionDigits:2, maximumFractionDigits:2});

    case "percent":    return Number(val).toFixed(1) + "%";
    case "int":        return Math.round(val).toLocaleString("en-MY");
    default:           return val;
  }
}
function pct(a, b){
  if (a === null || a === undefined || !b || b === 0) return null;

  if (p === null || p === undefined) return { icon:"—", cls:"flat", text:"No Change" };

  return { icon:"—", cls:"flat", text:"No Change" };
}

  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function toNaiveTimestampString(date){
  const pad = n => String(n).padStart(2,"0");
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

    return { overallToday, overallYesterday, projects, availableBrands };
  }

  // filters.start / filters.end 现在是纯日期字符串 "YYYY-MM-DD"，不看时间点，涵盖 end 当天整天
  const startDate = new Date(filters.start + "T00:00:00");
  const endExclusive = new Date(filters.end + "T00:00:00");
  endExclusive.setDate(endExclusive.getDate() + 1); // 涵盖 end 当天整天，到隔天 0 点为止（不含）

  // 上一个「等长」周期，紧接在 startDate 之前，用来算涨跌趋势
  const rangeMs = endExclusive - startDate;
  const prevStart = new Date(startDate.getTime() - rangeMs);
  const prevStartDateStr = toLocalDateString(prevStart);
  const endDateStr = filters.end; // 给 ai_expenses_entry 的 entry_date（DATE 类型）用

  /* ---------------------------------------------------------------------
     分页拉取工具：每一页都从 supabaseClient.from(table) 重新建一个全新的
     query builder（不重用已经 await 过的实例），固定 order by id 保证分页
     顺序稳定、不重复、不漏资料，直到某一页拿到的笔数 < PAGE_SIZE 才停止。
  --------------------------------------------------------------------- */
  const PAGE_SIZE = 1000;
  async function fetchAllRows(table, orderColumns, applyFilters){
    const orderCols = Array.isArray(orderColumns) ? orderColumns : [orderColumns];
    let all = [];
    let from = 0;
    while (true){
      let q = applyFilters(supabaseClient.from(table).select("*"));
      for (const col of orderCols) q = q.order(col, { ascending: true });
      q = q.range(from, from + PAGE_SIZE - 1);
      const { data, error } = await q;
      if (error){
        // 把完整的 error 对象展开打印（不要折叠），方便看到 message / code / details / hint
        console.error(`[fetch] ${table} 第 ${from}-${from+PAGE_SIZE-1} 页查询失败：`, JSON.stringify(error, null, 2), error);
        return { data: all, error }; // 已经拿到的页数先留着，不整批作废
      }
      if (!data || data.length === 0) break;
      all = all.concat(data);
      if (data.length < PAGE_SIZE) break; // 这页没拿满，说明已经是最后一页
      from += PAGE_SIZE;
    }
    return { data: all, error: null };
  }

  const [
    { data: rawRows, error: salesErr },
    { data: rawExpenseRows, error: expenseErr },
    { data: rawMarketRows, error: marketErr },
    { data: rawBrandRows, error: brandErr },
    { data: rawLegacyOrders, error: legacyOrdersErr },
    { data: rawLegacyProjects, error: legacyProjectsErr },
    { data: rawLegacyPages, error: legacyPageErr },
    { data: rawLegacyPagead, error: legacyPageadErr },
  ] = await Promise.all([
    fetchAllRows(TABLE_NAME, [COLUMN_MAP.order_date, "id"], q => {
      q = q.gte(COLUMN_MAP.order_date, toNaiveTimestampString(prevStart)).lt(COLUMN_MAP.order_date, toNaiveTimestampString(endExclusive));
      if (VALID_PAYMENT_STATUSES.length) q = q.in(COLUMN_MAP.payment_status, VALID_PAYMENT_STATUSES);
      return q;
    }),
    fetchAllRows(EXPENSE_TABLE_NAME, [EXPENSE_COLUMN_MAP.entry_date, "id"], q => q
      .eq(EXPENSE_COLUMN_MAP.expense_type_id, ADS_SPEND_EXPENSE_TYPE_ID)
      .gte(EXPENSE_COLUMN_MAP.entry_date, prevStartDateStr)
      .lte(EXPENSE_COLUMN_MAP.entry_date, endDateStr)),
    fetchAllRows(MARKET_TABLE_NAME, "id", q => q),
    fetchAllRows(BRAND_TABLE_NAME, "id", q => q),
    fetchAllRows(LEGACY_ORDERS_TABLE, [LEGACY_ORDER_COLUMN_MAP.created_datetime, "id"], q => q
      .gte(LEGACY_ORDER_COLUMN_MAP.created_datetime, toNaiveTimestampString(prevStart))
      .lt(LEGACY_ORDER_COLUMN_MAP.created_datetime, toNaiveTimestampString(endExclusive))),
    fetchAllRows(LEGACY_PROJECTS_TABLE, "id", q => q),
    fetchAllRows(LEGACY_PAGE_TABLE, "id", q => q),
    fetchAllRows(LEGACY_PAGEAD_TABLE, [LEGACY_PAGEAD_COLUMN_MAP.date, "id"], q => q
      .gte(LEGACY_PAGEAD_COLUMN_MAP.date, prevStartDateStr)
      .lte(LEGACY_PAGEAD_COLUMN_MAP.date, endDateStr)),
  ]);

  // 任何一张表查询失败都只是警告 + 当作那张表没有资料，不会让整个 dashboard 全部显示不出来
  const fetchErrors = [];
  if (salesErr) { console.warn(`[fetch] ${TABLE_NAME} 查询失败，Total Sales(OXM2) 这部分会是空的`, salesErr); fetchErrors.push(TABLE_NAME); }
  if (expenseErr) { console.warn(`[fetch] ${EXPENSE_TABLE_NAME} 查询失败，Ads Spend(OXM2) 这部分会是空的`, expenseErr); fetchErrors.push(EXPENSE_TABLE_NAME); }
  if (marketErr) { console.warn(`[fetch] ${MARKET_TABLE_NAME} 查询失败，OXM2 的品牌名可能会变成 Unknown`, marketErr); fetchErrors.push(MARKET_TABLE_NAME); }
  if (brandErr) { console.warn(`[fetch] ${BRAND_TABLE_NAME} 查询失败，OXM2 的品牌名可能会变成 Unknown`, brandErr); fetchErrors.push(BRAND_TABLE_NAME); }
  if (legacyOrdersErr) { console.warn(`[fetch] ${LEGACY_ORDERS_TABLE} 查询失败，Total Sales(legacy) 这部分会是空的`, legacyOrdersErr); fetchErrors.push(LEGACY_ORDERS_TABLE); }
  if (legacyProjectsErr) { console.warn(`[fetch] ${LEGACY_PROJECTS_TABLE} 查询失败，legacy 的品牌名可能会变成 Unknown`, legacyProjectsErr); fetchErrors.push(LEGACY_PROJECTS_TABLE); }
  if (legacyPageErr) { console.warn(`[fetch] ${LEGACY_PAGE_TABLE} 查询失败，legacy Ads Spend 的税率会算不出来`, legacyPageErr); fetchErrors.push(LEGACY_PAGE_TABLE); }
  if (legacyPageadErr) { console.warn(`[fetch] ${LEGACY_PAGEAD_TABLE} 查询失败，Ads Spend(legacy) 这部分会是空的`, legacyPageadErr); fetchErrors.push(LEGACY_PAGEAD_TABLE); }

  // 建 market_id → brand_id → brand name 的对应关系（OXM2 用）
  const marketToBrandId = {};
  for (const m of (rawMarketRows || [])) marketToBrandId[m[MARKET_COLUMN_MAP.id]] = m[MARKET_COLUMN_MAP.brand_id];
  const brandIdToName = {};
  for (const b of (rawBrandRows || [])) brandIdToName[b[BRAND_COLUMN_MAP.id]] = b[BRAND_COLUMN_MAP.name];
  function brandNameOf(marketId){
    const brandId = marketToBrandId[marketId];
    return (brandId && brandIdToName[brandId]) || "Unknown";
  }

  // legacy_projects.id → project_name（OXM1 的「项目」名字，如果跟 ai_brand.name 同名会自动合并）
  const legacyProjectIdToName = {};
  for (const p of (rawLegacyProjects || [])) legacyProjectIdToName[p[LEGACY_PROJECT_COLUMN_MAP.id]] = canonicalizeBrandName(p[LEGACY_PROJECT_COLUMN_MAP.project_name]);

  // OXM2 的订单，归一化成统一字段名，order_no 加前缀避免跟 legacy 的 order_no 撞在一起；只留白名单里的品牌
  const oxm2Rows = (rawRows || [])
    .filter(r => !EXCLUDED_ORDER_STATUSES.includes((r[COLUMN_MAP.order_status] || "").toLowerCase()))
    .map(r => ({
      [COLUMN_MAP.order_no]: "oxm2-" + r[COLUMN_MAP.order_no],
      [COLUMN_MAP.order_date]: r[COLUMN_MAP.order_date],
      [COLUMN_MAP.grand_total]: r[COLUMN_MAP.grand_total],
      _brandName: brandNameOf(r[COLUMN_MAP.market_id]),
      _source: "oxm2",
    }))
    .filter(r => isOxm2BrandAllowed(r._brandName));

  // legacy（OXM1）的订单：按 project name 分组，只看 project_id 在 LEGACY_ALLOWED_PROJECT_IDS 白名单里的，
  // 跟 Ads Spend 用同一份名单，两边标准统一。时间用 created_datetime。
  const legacyRows = (rawLegacyOrders || [])
    .filter(r => !EXCLUDED_ORDER_STATUSES.includes((r[LEGACY_ORDER_COLUMN_MAP.order_status] || "").toLowerCase()))
    .filter(r => LEGACY_ALLOWED_PROJECT_IDS.includes(Number(r[LEGACY_ORDER_COLUMN_MAP.project_id])))
    .map(r => ({
      [COLUMN_MAP.order_no]: "legacy-" + r[LEGACY_ORDER_COLUMN_MAP.order_no],
      [COLUMN_MAP.order_date]: r[LEGACY_ORDER_COLUMN_MAP.created_datetime],
      [COLUMN_MAP.grand_total]: r[LEGACY_ORDER_COLUMN_MAP.grand_total],
      _brandName: legacyProjectIdToName[r[LEGACY_ORDER_COLUMN_MAP.project_id]] || "Unknown",
      _source: "legacy",
    }));

  // Master 项目清单：ai_brand 里在 OXM2_ALLOWED_BRAND_NAMES 白名单内的品牌 + LEGACY_ALLOWED_PROJECT_IDS
  // 白名单对应的 project_name，不管这段时间有没有数据，都要出现在 dashboard 上（没数据就是 0，不是消失）
  const allBrandNames = new Set();
  for (const b of (rawBrandRows || [])){
    const n = b[BRAND_COLUMN_MAP.name];
    if (n && isOxm2BrandAllowed(n)) allBrandNames.add(n);
  }
  for (const pid of LEGACY_ALLOWED_PROJECT_IDS){
    const n = legacyProjectIdToName[pid];
    if (n) allBrandNames.add(n);
    // 白名单里的 id 在 legacy_projects 查不到名字，说明这个 project_id 在 legacy_projects 里没有对应的行——
    // 这是数据本身的问题，用 console.warn 提醒一下，方便你去数据库查
    else console.warn(`[dashboard] legacy project_id ${pid} 在 legacy_projects 里找不到对应的 project_name`);
  }
  for (const name of [...allBrandNames]) if (isExcludedBrand(name)) allBrandNames.delete(name);

  // 两个来源合并成一份，下面所有统计逻辑都不用再区分来源；顺便把排除名单里的品牌也踢掉
  const rows = [...oxm2Rows, ...legacyRows].filter(r => !isExcludedBrand(r._brandName));

  const startDateStr = filters.start.slice(0,10); // 纯 DATE 字段（entry_date / legacy_pagead.date）都用日期部分比较

  // legacy Ads Spent —— 完全照你给的 SQL 逻辑重写：
  //   1. project 直接用 legacy_pagead.project_id → legacy_projects.project_name（不再绕道 legacy_page）
  //   2. legacy_page 只用来拿税率（page_id join），找不到对应 page 就跳过（等同 SQL 的 INNER JOIN）
  //   3. 税率 = 0 就当 1（不调整），不是 0 就直接乘那个值
  //   4. 筛选用 LEGACY_ALLOWED_PROJECT_IDS（跟 Sales 那边同一份名单）
  const legacyPageTaxById = {};
  for (const p of (rawLegacyPages || [])){
    legacyPageTaxById[p[LEGACY_PAGE_COLUMN_MAP.id]] = {
      gst: Number(p[LEGACY_PAGE_COLUMN_MAP.gst_tax_percentage]) || 0,
      withholding: Number(p[LEGACY_PAGE_COLUMN_MAP.witholding_tax_percentage]) || 0,
    };
  }
  function aggregateLegacyAdsSpendByBrand(pageadRows, debugStats){
    const map = {};
    for (const ad of pageadRows){
      const projectId = ad[LEGACY_PAGEAD_COLUMN_MAP.project_id];
      if (!LEGACY_ALLOWED_PROJECT_IDS.includes(Number(projectId))){
        if (debugStats) debugStats.blockedByWhitelist[projectId] = (debugStats.blockedByWhitelist[projectId] || 0) + 1;
        continue; // project_id 白名单（统一转 Number 比对，避免字符串/数字类型对不上）
      }
      const tax = legacyPageTaxById[ad[LEGACY_PAGEAD_COLUMN_MAP.page_id]];
      if (!tax){
        if (debugStats) debugStats.blockedByMissingPage[ad[LEGACY_PAGEAD_COLUMN_MAP.page_id]] = (debugStats.blockedByMissingPage[ad[LEGACY_PAGEAD_COLUMN_MAP.page_id]] || 0) + 1;
        continue; // 找不到对应 page，等同 SQL 的 INNER JOIN 筛掉
      }
      const gstMult = tax.gst === 0 ? 1 : tax.gst;
      const whMult = tax.withholding === 0 ? 1 : tax.withholding;
      const spend = (Number(ad[LEGACY_PAGEAD_COLUMN_MAP.fb_ad_cost_spent]) || 0) * gstMult * whMult;
      const brand = legacyProjectIdToName[projectId] || "Unknown";
      if (isExcludedBrand(brand)) continue;
      map[brand] = (map[brand] || 0) + spend;
      if (debugStats) debugStats.included++;
    }
    return map;
  }
  const currentLegacyPagead = (rawLegacyPagead || []).filter(ad => ad[LEGACY_PAGEAD_COLUMN_MAP.date] >= startDateStr);
  const prevLegacyPagead = (rawLegacyPagead || []).filter(ad => ad[LEGACY_PAGEAD_COLUMN_MAP.date] < startDateStr);

  // 汇总诊断：这次刷新总共有几笔 legacy_pagead 落在日期范围内、被白名单挡了几笔（挡了哪些 project_id）、
  // 找不到 page 税率被挡了几笔（挡了哪些 page_id）、最后真的算进去了几笔
  const legacyAdsDebug = { included: 0, blockedByWhitelist: {}, blockedByMissingPage: {} };
  const currentLegacyAdsByBrand = aggregateLegacyAdsSpendByBrand(currentLegacyPagead, legacyAdsDebug);
  const prevLegacyAdsByBrand = aggregateLegacyAdsSpendByBrand(prevLegacyPagead);
  console.log(`[legacy ads] 日期范围内共 ${currentLegacyPagead.length} 笔 pagead，算进去 ${legacyAdsDebug.included} 笔`);
  if (Object.keys(legacyAdsDebug.blockedByWhitelist).length){
    console.log("[legacy ads] 被 project_id 白名单挡掉（project_id → 被挡笔数）:", legacyAdsDebug.blockedByWhitelist);
  }
  if (Object.keys(legacyAdsDebug.blockedByMissingPage).length){
    console.log("[legacy ads] 找不到对应 page 税率被挡掉（page_id → 被挡笔数）:", legacyAdsDebug.blockedByMissingPage);
  }

  const currentRows = rows.filter(r => new Date(r[COLUMN_MAP.order_date]) >= startDate);
  const prevRows = rows.filter(r => new Date(r[COLUMN_MAP.order_date]) < startDate);

  const availableBrands = [...allBrandNames].sort();

  const filteredCurrentRows = filters.project === "all" ? currentRows : currentRows.filter(r => r._brandName === filters.project);
  const filteredPrevRows = filters.project === "all" ? prevRows : prevRows.filter(r => r._brandName === filters.project);

  // active/idle：品牌在筛选范围内「最近一天」有没有单，不是写死的
  const latestDay = filteredCurrentRows.length
    ? filteredCurrentRows.reduce((max, r) => {
        const d = toLocalDateString(new Date(r[COLUMN_MAP.order_date]));
        return d > max ? d : max;
      }, "0000-00-00")
    : null;
  const activeBrandsToday = new Set(
    filteredCurrentRows
      .filter(r => toLocalDateString(new Date(r[COLUMN_MAP.order_date])) === latestDay)
      .map(r => r._brandName)
  );

  const expenseRows = (rawExpenseRows || [])
    .map(r => ({ ...r, _brandName: brandNameOf(r[EXPENSE_COLUMN_MAP.market_id]) }))
    .filter(r => !isExcludedBrand(r._brandName))
    .filter(r => isOxm2BrandAllowed(r._brandName));
  const currentExpenseRows = expenseRows.filter(r => r[EXPENSE_COLUMN_MAP.entry_date] >= startDateStr);
  const prevExpenseRows = expenseRows.filter(r => r[EXPENSE_COLUMN_MAP.entry_date] < startDateStr);

  // OXM2（ai_expenses_entry）+ legacy（legacy_pagead）两边都已经按日期拆好了，直接合并
  const currentAdsByBrand = mergeAdsSpend(aggregateAdsSpendByBrand(currentExpenseRows), currentLegacyAdsByBrand);
  const prevAdsByBrand = mergeAdsSpend(aggregateAdsSpendByBrand(prevExpenseRows), prevLegacyAdsByBrand);

  // 大盘 Ads Spend：project=all 时 sum 全部品牌；筛了某个项目就只算那个品牌
  const overallCurrentAds = filters.project === "all"
    ? Object.values(currentAdsByBrand).reduce((a,v)=>a+v,0)
    : (currentAdsByBrand[filters.project] || 0);
  const overallPrevAds = filters.project === "all"
    ? Object.values(prevAdsByBrand).reduce((a,v)=>a+v,0)
    : (prevAdsByBrand[filters.project] || 0);

  const overallToday = aggregateOverall(filteredCurrentRows, overallCurrentAds);
  const overallYesterday = aggregateOverall(filteredPrevRows, overallPrevAds);

  const currentByBrand = aggregateByBrand(filteredCurrentRows);
  const prevByBrand = aggregateByBrand(filteredPrevRows);
  const currentBrandMap = Object.fromEntries(currentByBrand.map(b => [b.project_name, b]));
  const prevBrandMap = Object.fromEntries(prevByBrand.map(b => [b.project_name, b]));

  // 遍历 master 清单（而不是只遍历「这段时间有数据」的品牌），保证没数据的项目也会显示出来，值是 0
  const projectNamesToShow = filters.project === "all" ? [...allBrandNames] : [filters.project];
  const projects = projectNamesToShow.map(name => {
    const b = currentBrandMap[name] || { project_name: name, total_sales: 0, total_orders: 0, aov: 0, status: "active" };
    const y = prevBrandMap[name];
    const adsSpent = currentAdsByBrand[name] || 0;
    const prevAdsSpent = prevAdsByBrand[name] || 0;
    const roas = adsSpent > 0 ? +(b.total_sales / adsSpent).toFixed(2) : null;
    const prevRoas = (y && prevAdsSpent > 0) ? +(y.total_sales / prevAdsSpent).toFixed(2) : null;
    return {
      ...b,
      project_name: name,
      project_type: classifyBrand(name),
      ads_spent: adsSpent,
      roas,
      status: activeBrandsToday.has(name) ? "active" : "idle",
      trends: {
        ads_spent:    pct(adsSpent, prevAdsSpent),
        total_sales:  pct(b.total_sales, y ? y.total_sales : null),
        roas:         pct(roas, prevRoas),
        aov:          pct(b.aov, y ? y.aov : null),
        total_orders: pct(b.total_orders, y ? y.total_orders : null),
      },
    };
  });

  return { overallToday, overallYesterday, projects, availableBrands, fetchErrors };
}

// 把 OXM2（ai_expenses_entry）跟 legacy（page × 税率）两份 Ads Spend 按品牌名合并成一份
function mergeAdsSpend(...dicts){
  const out = {};
  for (const d of dicts){
    for (const brand in d){
      out[brand] = (out[brand] || 0) + d[brand];
    }
  }
  return out;
}

// 把 ai_expenses_entry 的 Ads Spend 行按品牌（通过 market → brand 换算出来的）汇总
function aggregateAdsSpendByBrand(rows){
  const map = {};
  for (const r of rows){
    const brand = r._brandName || "Unknown";
    map[brand] = (map[brand] || 0) + expenseAmount(r);
  }
  return map;
}

// 把一批订单行按品牌（通过 market → brand 换算出来的）汇总成「项目」
function aggregateByBrand(rows){
  const map = {};
  for (const r of rows){
    const brand = r._brandName || "Unknown";
    if (!map[brand]) map[brand] = { project_name: brand, total_sales:0, orderSet:new Set() };
    map[brand].total_sales += Number(r[COLUMN_MAP.grand_total]) || 0;
    map[brand].orderSet.add(r[COLUMN_MAP.order_no]);
  }
  return Object.values(map).map(m => ({
    project_name: m.project_name,
    total_sales: +m.total_sales.toFixed(2),
    total_orders: m.orderSet.size,
    aov: m.orderSet.size ? +(m.total_sales / m.orderSet.size).toFixed(2) : 0,
    status: "active",
  }));
}

// 大盘 KPI：sum 选中日期范围内的所有订单 + 对应的 Ads Spend
function aggregateOverall(rows, adsSpent){
  const sales = rows.reduce((a,r)=> a + (Number(r[COLUMN_MAP.grand_total]) || 0), 0);
  const orderSet = new Set(rows.map(r => r[COLUMN_MAP.order_no]));
  return {
    total_sales: +sales.toFixed(2),
    ads_spent: +Number(adsSpent || 0).toFixed(2),
    roas: adsSpent > 0 ? +(sales/adsSpent).toFixed(2) : null,
    aov: orderSet.size ? +(sales/orderSet.size).toFixed(2) : 0,
    total_orders: orderSet.size,
  };
}

/* ---------------------------------------------------------------------
   RENDER: KPI CARDS
--------------------------------------------------------------------- */
function kpiCardHTML(def, cur, prev){
  if (def.placeholder){
    return `
      <div class="panel p-4 opacity-70">
        <p class="eyebrow mb-2">${def.label}</p>
        <p class="kpi-val font-mono text-2xl font-bold text-[color:var(--text-low)]">--</p>
        <p class="text-xs mt-1 font-mono" style="color:var(--text-low)">待接入数据</p>
      </div>`;
  }
  const change = pct(cur, prev);
  const t = trendMeta(change);
  return `
    <div class="panel p-4 flash-update">
      <p class="eyebrow mb-2">${def.label}</p>
      <p class="kpi-val font-mono text-2xl font-bold">${fmtValue(cur, def.fmt)}</p>
      <p class="text-xs mt-1 ${t.cls} font-mono">${t.icon} ${t.text} <span class="text-[color:var(--text-low)] font-sans">vs previous period</span></p>
    </div>`;
}
function renderKPIGrid(today, yesterday){
  const [heroDef, ...restDefs] = KPI_DEFS;

  // Hero 卡：Total Sales，放大展示
  const heroCur = today[heroDef.key], heroPrev = yesterday[heroDef.key];
  const heroChange = pct(heroCur, heroPrev);
  const ht = trendMeta(heroChange);
  document.getElementById("kpiHero").innerHTML = `
    <p class="eyebrow mb-2">${heroDef.label}</p>
    <p class="kpi-val font-mono text-3xl font-extrabold whitespace-nowrap" style="color:var(--gold-bright)">${fmtValue(heroCur, heroDef.fmt)}</p>
    <p class="text-sm mt-2 ${ht.cls} font-mono">${ht.icon} ${ht.text} <span class="text-[color:var(--text-low)] font-sans">vs previous period</span></p>
  `;

  const grid = document.getElementById("kpiGrid");
  grid.innerHTML = restDefs.map(def => kpiCardHTML(def, today[def.key], yesterday[def.key])).join("");
}

/* ---------------------------------------------------------------------
   RENDER: RANKINGS
--------------------------------------------------------------------- */
function rankBadgeClass(i){
  if (i===0) return "rank-1"; if (i===1) return "rank-2"; if (i===2) return "rank-3"; return "rank-n";
}
function renderRanking(elId, list){
  const el = document.getElementById(elId);
  const top10 = [...list].sort((a,b)=>b.total_sales - a.total_sales).slice(0,10);
  el.innerHTML = top10.map((p,i) => `
    <div class="flex items-center gap-3 py-2 px-1 rounded-lg">
      <div class="rank-badge ${rankBadgeClass(i)}">${i+1}</div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${p.project_name}</p>
        <p class="text-xs text-[color:var(--text-low)] font-mono">${fmtValue(p.total_orders,"int")} orders</p>
      </div>
      <p class="font-mono text-sm font-semibold">${fmtValue(p.total_sales,"currency")}</p>
    </div>`).join("") || `<p class="text-sm text-[color:var(--text-mid)]">暂无数据</p>`;
}

/* ---------------------------------------------------------------------
   RENDER: PROJECT TABLE — 可点击表头排序，每个数值列下面带 vs previous period 的 %
--------------------------------------------------------------------- */
const TABLE_COLUMNS = [
  { key: "project_name", label: "Project",     sortable: true,  numeric: false },
  { key: "ads_spent",    label: "Ads Spent",   sortable: true,  numeric: true, fmt: "currency" },
  { key: "total_sales",  label: "Total Sales", sortable: true,  numeric: true, fmt: "currency" },
  { key: "roas",         label: "ROME",        sortable: true,  numeric: true, fmt: "ratio" },
  { key: "aov",          label: "AOV",         sortable: true,  numeric: true, fmt: "currency" },
  { key: "total_orders", label: "Orders",      sortable: true,  numeric: true, fmt: "int" },
  { key: "status",       label: "Status",      sortable: false, numeric: false },
];

let tableSortState = { key: "total_sales", dir: "desc" };
let lastProjects = []; // 缓存最近一次拿到的数据，点表头排序时不用重新拉取

function renderTableHead(){
  const head = document.getElementById("perfTableHead");
  head.innerHTML = TABLE_COLUMNS.map(col => {
    const isActive = tableSortState.key === col.key;
    const arrow = isActive ? (tableSortState.dir === "asc" ? "▲" : "▼") : "";
    const cls = col.sortable ? "py-2 pr-4 sort-th" : "py-2 pr-4";
    return `<th class="${cls}" data-key="${col.key}">${col.label} <span style="color:var(--gold-bright)">${arrow}</span></th>`;
  }).join("");

  head.querySelectorAll(".sort-th").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (tableSortState.key === key){
        tableSortState.dir = tableSortState.dir === "asc" ? "desc" : "asc";
      } else {
        tableSortState = { key, dir: "desc" };
      }
      renderTableHead();
      renderTable(lastProjects, false);
    });
  });
}

function trendSpanHTML(trendPct){
  const t = trendMeta(trendPct);
  return `<div class="cell-trend ${t.cls}">${t.icon} ${t.text}</div>`;
}

function renderTable(projects, cache = true){
  if (cache) lastProjects = projects;
  const body = document.getElementById("perfTableBody");
  document.getElementById("tableCount").textContent = `${projects.length} projects`;

  const { key, dir } = tableSortState;
  const sorted = [...projects].sort((a,b) => {
    let av = a[key], bv = b[key];
    if (typeof av === "string" || typeof bv === "string"){
      av = (av ?? "").toString().toLowerCase(); bv = (bv ?? "").toString().toLowerCase();
      return dir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    av = av ?? -Infinity; bv = bv ?? -Infinity;
    return dir === "asc" ? av - bv : bv - av;
  });

  body.innerHTML = sorted.map(p => `
    <tr>
      <td class="py-2.5 pr-4">
        <span class="font-medium">${p.project_name}</span>
        <span class="text-xs text-[color:var(--text-low)] ml-1">${p.project_type}</span>
      </td>
      <td class="py-2.5 pr-4 font-mono">
        ${fmtValue(p.ads_spent,"currency")}
        ${trendSpanHTML(p.trends?.ads_spent)}
      </td>
      <td class="py-2.5 pr-4 font-mono font-semibold">
        ${fmtValue(p.total_sales,"currency")}
        ${trendSpanHTML(p.trends?.total_sales)}
      </td>
      <td class="py-2.5 pr-4 font-mono">
        ${fmtValue(p.roas,"ratio")}
        ${trendSpanHTML(p.trends?.roas)}
      </td>
      <td class="py-2.5 pr-4 font-mono">
        ${fmtValue(p.aov,"currency")}
        ${trendSpanHTML(p.trends?.aov)}
      </td>
      <td class="py-2.5 pr-4 font-mono">
        ${fmtValue(p.total_orders,"int")}
        ${trendSpanHTML(p.trends?.total_orders)}
      </td>
      <td class="py-2.5 pr-4">
        <span class="status-dot status-${p.status||'active'}"></span>
        <span class="text-xs capitalize">${p.status||'active'}</span>
      </td>
    </tr>`).join("");
}

/* ---------------------------------------------------------------------
   MAIN REFRESH CYCLE
--------------------------------------------------------------------- */
// 每次刷新发一个 token 出去，只有「当前最新的那一次」有资格把结果画到画面上——
// 避免自动刷新 / 手动 Apply 这些动作重叠触发时，先发出去的请求晚回来反而把新结果盖掉
let latestRefreshToken = 0;
let trackToday = true; // start/end 还没被手动改过的话，每次刷新都固定显示「今天」，跨过午夜也会自动跟着走
async function refreshDashboard(){
  const myToken = ++latestRefreshToken;
  try{
    if (trackToday){
      currentFilters.start = todayStr();
      currentFilters.end = todayStr();
      document.getElementById("filterStartDate").value = currentFilters.start;
      document.getElementById("filterEndDate").value = currentFilters.end;
    }
    const data = await fetchDashboardData(currentFilters);
    if (myToken !== latestRefreshToken) return; // 这期间已经有更新的刷新发生了，这次的结果作废，不画
    renderKPIGrid(data.overallToday, data.overallYesterday);
    renderRankingSection(data.projects);
    renderTable(data.projects);
    populateProjectFilter(data.availableBrands || []);
    document.getElementById("filterSummary").textContent =
      `${currentFilters.start} → ${currentFilters.end} · ${currentFilters.project === "all" ? "All Projects" : currentFilters.project}`
      + ((data.fetchErrors && data.fetchErrors.length) ? `  ⚠ 查询失败: ${data.fetchErrors.join(", ")}（看 Console 详情）` : "");
    document.getElementById("lastRefresh").textContent = new Date().toLocaleTimeString("en-MY", {hour12:false});
  }catch(err){
    if (myToken !== latestRefreshToken) return; // 同上，旧请求的报错也不该覆盖新请求的状态
    console.error(err);
    document.getElementById("lastRefresh").textContent = "Error — see console";
  }
}

// 填充 Project 下拉选项，保留当前已选中的值
function populateProjectFilter(brands){
  const select = document.getElementById("filterProject");
  const prevValue = select.value || currentFilters.project;
  select.innerHTML = `<option value="all">All Projects</option>` +
    brands.map(b => `<option value="${b}">${b}</option>`).join("");
  if ([...select.options].some(o => o.value === prevValue)) select.value = prevValue;
}

// BRAND_TYPE_MAP 是空的时候，先合并显示一个总排名；
// 等你把 internal/external 规则发我填进 BRAND_TYPE_MAP，会自动变回左右两栏
function renderRankingSection(projects){
  const hasClassification = projects.some(p => p.project_type === "internal" || p.project_type === "external");
  const section = document.getElementById("rankingSection");
  const externalPanel = document.getElementById("externalPanel");

  if (hasClassification){
    section.className = "grid grid-cols-2 gap-4";
    externalPanel.classList.remove("hidden");
    document.getElementById("internalTitle").textContent = "Internal Ranking · Top 10";
    renderRanking("internalRanking", projects.filter(p=>p.project_type==="internal"));
    renderRanking("externalRanking", projects.filter(p=>p.project_type==="external"));
  } else {
    section.className = "grid grid-cols-1 gap-4";
    externalPanel.classList.add("hidden");
    document.getElementById("internalTitle").textContent = "Brand Ranking · Top 10 (待 Internal/External 分类规则)";
    renderRanking("internalRanking", projects);
  }
}

/* ---------------------------------------------------------------------
   CLOCK + AUTO REFRESH（每 10 分钟静默刷新一次，不在界面上显示倒数）
   时钟显示跟资料刷新用两个独立的计时器，资料刷新直接用 setInterval 定时触发，
   不靠「每秒累加到 N 次」这种写法——分页被浏览器丢到背景时更不容易被卡住
--------------------------------------------------------------------- */
function updateClock(){
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-MY", {hour12:false});
}

/* ---------------------------------------------------------------------
   FILTER BAR — 日期范围 + 项目筛选
--------------------------------------------------------------------- */
function initFilterBar(){
  document.getElementById("filterStartDate").value = currentFilters.start;
  document.getElementById("filterEndDate").value = currentFilters.end;

  document.getElementById("filterApply").addEventListener("click", () => {
    const start = document.getElementById("filterStartDate").value || todayStr();
    const end = document.getElementById("filterEndDate").value || todayStr();
    const project = document.getElementById("filterProject").value || "all";
    trackToday = (start === todayStr() && end === todayStr()); // 手动选的刚好是「今天到今天」，也当作跟着今天走；选了别的范围就固定住，不再自动跳
    currentFilters = { start, end, project };
    refreshDashboard();
  });

  document.getElementById("filterReset").addEventListener("click", () => {
    trackToday = true;
    currentFilters = { start: todayStr(), end: todayStr(), project: "all" };
    document.getElementById("filterStartDate").value = currentFilters.start;
    document.getElementById("filterEndDate").value = currentFilters.end;
    document.getElementById("filterProject").value = "all";
    refreshDashboard();
  });
}

/* ---------------------------------------------------------------------
   INIT
--------------------------------------------------------------------- */
window.addEventListener("DOMContentLoaded", () => {
  if (DEMO_MODE){
    const banner = document.createElement("div");
    banner.className = "mx-4 mt-4 mb-0 text-xs text-center py-2 rounded-lg";
    banner.style.cssText = "background:rgba(232,185,62,0.1); border:1px solid rgba(232,185,62,0.3); color:var(--gold-bright)";
    banner.textContent = "⚠ DEMO MODE — 尚未连接 Supabase，当前展示的是示例数据。请在 index.html 顶部 CONFIG 里填入 SUPABASE_URL 和 SUPABASE_ANON_KEY。";
    document.body.insertBefore(banner, document.body.firstChild.nextSibling);
  }
  initFilterBar();
  renderTableHead();
  refreshDashboard();
  setInterval(updateClock, 1000);
  setInterval(refreshDashboard, CONFIG.REFRESH_INTERVAL_MS);

  // 分页从背景（切到别的分页 / 螢幕休眠）切回来的时候，强制刷新一次，
  // 避免离开画面太久、回来看到的还是很旧的资料
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refreshDashboard();
  });
});
</script>
