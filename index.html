<style>
  :root{
    --bg-deep:#060D1E;
    --bg-panel-a:#0E2350;
    --bg-panel-b:#081428;
    --bg-panel-c:#171540;
    --panel-line: rgba(59,130,246,0.32);
    --blue:#2F7FF0;
    --blue-bright:#4F9BF5;
    --blue-deep:#1F5FD8;
    --accent-light:#9CC4FF;
    --green:#7BE8B6;
    --green-bg: rgba(53,208,138,0.08);
    --red:#FF9AA8;
    --red-bg: rgba(255,122,144,0.14);
    --text-hi:#E8F0FF;
    --text-mid:#7C93BF;

  .panel{
    background: linear-gradient(120deg, var(--bg-panel-a) 0%, var(--bg-panel-b) 55%, var(--bg-panel-c) 100%);
    border: 1px solid var(--panel-line);
    border-radius: 18px;
    position: relative;
  }
  .panel::before{
    content:"";
    position:absolute; inset:0; border-radius:18px; padding:1px;
    background: linear-gradient(135deg, rgba(79,155,245,0.35), rgba(156,196,255,0.12) 40%, transparent 70%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events:none;
  }

  .eyebrow{ letter-spacing:.18em; font-size:11px; color:var(--text-mid); text-transform:uppercase; }

  /* live pulse dot */
  .pulse-dot{ width:8px; height:8px; border-radius:9999px; background:var(--green); position:relative; }
  .pulse-dot::after{
    content:""; position:absolute; inset:-6px; border-radius:9999px;
    border:1px solid var(--green); animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{ 0%{ transform:scale(.4); opacity:.9;} 100%{ transform:scale(1.8); opacity:0;} }

  /* blue scan line across header */
  .scan-line{
    position:absolute; top:0; left:-30%; width:30%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(156,196,255,0.10), transparent);
    animation: scan 6s linear infinite;
    pointer-events:none;
  }
  @keyframes scan{ 0%{ left:-30%; } 100%{ left:110%; } }

  .kpi-val{ font-family:'Oswald',sans-serif; font-variant-numeric: tabular-nums; line-height: 1.1; }

    line-height: 1.05;

  .down{ color:var(--red); }
  .flat{ color:var(--text-mid); }

/* ---------------------------------------------------------------------
   格式化工具
--------------------------------------------------------------------- */
function fmtValue(val, type){
  if (val === null || val === undefined) return "--";
  switch(type){
    case "currency":  return "RM " + Number(val).toLocaleString("en-MY", {minimumFractionDigits:2, maximumFractionDigits:2});
    case "currency2": return "RM " + Number(val).toLocaleString("en-MY", {minimumFractionDigits:2, maximumFractionDigits:2});
    case "ratio":      return Number(val).toFixed(2) + "x";
    case "percent":    return Number(val).toFixed(1) + "%";
    case "int":        return Math.round(val).toLocaleString("en-MY");
    default:           return val;
  }
}
/** 项目名字打码：只留前两个字母，其余用 *** 盖住，不暴露完整项目名 */
function maskName(name){
  if (!name) return name;
  return name.slice(0, 2) + "***";
}
function pct(a, b){
  if (a === null || a === undefined || !b || b === 0) return null;
  return ((a - b) / b) * 100;
}
function trendMeta(p){
  if (p === null || p === undefined) return { icon:"—", cls:"flat", text:"No Change" };
  if (p > 0.05)  return { icon:"▲", cls:"up",   text: `+${p.toFixed(1)}%` };
  if (p < -0.05) return { icon:"▼", cls:"down", text: `${p.toFixed(1)}%` };
  return { icon:"—", cls:"flat", text:"No Change" };
}
// 给 Postgres 的 TIMESTAMP（不带时区）欄位查询用：直接照本地时间的数字组字符串，
// 不能用 .toISOString()——那个会先转成 UTC，本地时间跟 UTC 差几小时，查询窗口就会跟着偏移
// legacy_orders.created_datetime 就是这种「没带时区，存的就是马来西亚本地时间」的欄位，直接用这个。
function toNaiveTimestampString(date){
  const pad = n => String(n).padStart(2,"0");
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}
// 给 ai_order.created_at 这种 timestamptz 欄位查询用：跟上面同样取本地时间的数字，
// 但要带上明确的 +08:00，不然 PostgREST 会拿它自己的 session 时区（UTC）去解释这串没带时区的文字，
// 整个查询窗口会偏移 8 小时，边界附近的订单就会被算错区间。
function toMYTOffsetTimestampString(date){
  return toNaiveTimestampString(date) + "+08:00";
}
// 给 DATE 欄位查询用：同理，取本地日期，不要用 toISOString().slice(0,10)
function toLocalDateString(date){
  const pad = n => String(n).padStart(2,"0");
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
}

function genDemoOverall(projects){
  const sum = k => projects.reduce((a,p)=>a+(p[k]||0),0);
  const sales = sum("total_sales"), ads = sum("ads_spent"), orders = sum("total_orders");
  return {
    total_sales: sales, ads_spent: ads,
    roas: +(sales/ads).toFixed(2),
    conversion_rate: +(projects.reduce((a,p)=>a+p.conversion_rate,0)/projects.length).toFixed(1),
    cpm: +(projects.reduce((a,p)=>a+p.cpm,0)/projects.length).toFixed(2),
    aov: +(sales/orders).toFixed(2),
    total_orders: orders,
    new_orders: Math.round(orders*0.55),
    repeat_orders: Math.round(orders*0.45),
    new_customers: Math.round(orders*0.4),
    repeat_customers: Math.round(orders*0.35),
  };
}
/* =====================================================================
   COLUMN MAP — 对应你 Supabase 里 `dashboard_sales` 这张表的实际列名
   （ai_order 一行 = 一笔订单，只带 market_id，不直接带品牌名；
   要拿品牌名得 ai_order.market_id → ai_market.id → ai_market.brand_id → ai_brand.name 这样 join 两层）

/* =====================================================================
   DATE RANGE — 不是 MTD，是写死的活动区间：
   2026-08-07 13:00:00 至 2026-08-08 13:00:00，马来西亚时间（UTC+8）
   ===================================================================== */
const CAMPAIGN_START = new Date("2026-08-07T13:00:00+08:00");
const CAMPAIGN_END   = new Date("2026-08-08T13:00:00+08:00");
// ILady 单独多算 30 分钟，到 13:30 截止；其他项目还是原本的 13:00
const ILADY_EXTENDED_END = new Date("2026-08-08T13:30:00+08:00");
// 手动加进去的 Total Sales，不对应任何具体订单，跟现有算出来的数字加在一起
const MANUAL_SALES_ADJUSTMENTS = {
  "Recovit": 24248.00,
  "NINOKO3in1Kidzzz": 64851.00,
};
let currentFilters = { project: "all" };

/* ---------------------------------------------------------------------
   DATA FETCH — 支持日期范围筛选 + 项目筛选
   Demo 模式下用生成数据；真实模式下查 dashboard_sales（销售）+ expense_entry（广告花费）两张表并在前端汇总
--------------------------------------------------------------------- */
async function fetchDashboardData(filters){
  if (DEMO_MODE){
    let projects = genDemoProjects();
    if (filters.project !== "all") projects = projects.filter(p => p.project_name === filters.project);
    const overallToday = genDemoOverall(projects);
    const overallYesterday = genDemoOverall(projects.map(p=>({...p, total_sales:p.prev_total_sales})));
    const availableBrands = genDemoProjects().map(p => p.project_name);
    const series = [18,22,19,26,24,30,28].map((v,i) => ({ date: `demo-${i}`, total_sales: v * 1000 }));
    return { overallToday, overallYesterday, projects, availableBrands, series };
  }

  const startDate = CAMPAIGN_START;
  const endExclusive = CAMPAIGN_END;
  // 拉资料的上限要盖到 ILady 那多出来的 30 分钟，不然 Supabase 那边根本不会把
  // 13:00-13:30 这段的订单捞回来；其他项目要用回 13:00 的话，靠下面 currentRows
  // 那边逐行判断挡住，不是靠这个查询边界。
  const fetchEndExclusive = new Date(Math.max(endExclusive.getTime(), ILADY_EXTENDED_END.getTime()));

  // 上一个「等长」周期，紧接在 startDate 之前，用来算涨跌趋势
  const rangeMs = endExclusive - startDate;
  const prevStart = new Date(startDate.getTime() - rangeMs);
  const prevStartDateStr = toLocalDateString(prevStart);
  const endDateStr = toLocalDateString(endExclusive); // 给 ai_expenses_entry 的 entry_date（DATE 类型）用

  /* ---------------------------------------------------------------------
     分页拉取工具：用 id 做 keyset 分页（`id > 上一页最后一个 id`），不用 .range() 的
     offset 分页——活动区间现在是一整个月，legacy_orders 这种两百万行的表用 offset 翻到
     后面几页，Postgres 要先扫过并丢掉前面全部的行，翻到第十几页就整个 statement timeout，
     导致 dashboard 直接空白。keyset 分页靠 id 索引直接定位到下一页起点，翻多少页都一样快。
  --------------------------------------------------------------------- */
  const PAGE_SIZE = 1000;
  async function fetchAllRows(table, idColumn, applyFilters){
    let all = [];
    let lastId = null;
    while (true){
      let q = applyFilters(supabaseClient.from(table).select("*"));
      if (lastId !== null) q = q.gt(idColumn, lastId);
      q = q.order(idColumn, { ascending: true }).limit(PAGE_SIZE);
      const { data, error } = await q;
      if (error){
        // 把完整的 error 对象展开打印（不要折叠），方便看到 message / code / details / hint
        console.error(`[fetch] ${table} 从 ${idColumn}>${lastId} 开始查询失败：`, JSON.stringify(error, null, 2), error);
        return { data: all, error }; // 已经拿到的页数先留着，不整批作废
      }
      if (!data || data.length === 0) break;
      all = all.concat(data);
      lastId = data[data.length - 1][idColumn];
      if (data.length < PAGE_SIZE) break; // 这页没拿满，说明已经是最后一页
    }
    return { data: all, error: null };
  }

  const [
    { data: rawRows, error: salesErr },
    { data: rawExpenseRows, error: expenseErr },
    { data: rawMarketRows, error: marketErr },
    { data: rawBrandRows, error: brandErr },
    { data: rawLegacyOrders, error: legacyOrdersErr },
    { data: rawLegacyProjects, error: legacyProjectsErr },
    { data: rawLegacyPageSst, error: legacyPageSstErr },
    { data: rawLegacyPagead, error: legacyPageadErr },
  ] = await Promise.all([
    fetchAllRows(TABLE_NAME, "id", q => {
      q = q.gte(COLUMN_MAP.order_date, toMYTOffsetTimestampString(prevStart)).lt(COLUMN_MAP.order_date, toMYTOffsetTimestampString(fetchEndExclusive));
      if (VALID_PAYMENT_STATUSES.length) q = q.in(COLUMN_MAP.payment_status, VALID_PAYMENT_STATUSES);
      return q;
    }),
    fetchAllRows(EXPENSE_TABLE_NAME, "id", q => q
      .eq(EXPENSE_COLUMN_MAP.expense_type_id, ADS_SPEND_EXPENSE_TYPE_ID)
      .gte(EXPENSE_COLUMN_MAP.entry_date, prevStartDateStr)
      .lte(EXPENSE_COLUMN_MAP.entry_date, endDateStr)),
    fetchAllRows(MARKET_TABLE_NAME, "id", q => q),
    fetchAllRows(BRAND_TABLE_NAME, "id", q => q),
    fetchAllRows(LEGACY_ORDERS_TABLE, "id", q => q
      .gte(LEGACY_ORDER_COLUMN_MAP.order_date, toNaiveTimestampString(prevStart))
      .lt(LEGACY_ORDER_COLUMN_MAP.order_date, toNaiveTimestampString(fetchEndExclusive))),
    fetchAllRows(LEGACY_PROJECTS_TABLE, "id", q => q),
    fetchAllRows(LEGACY_PAGESST_TABLE, "id", q => q),
    fetchAllRows(LEGACY_PAGEAD_TABLE, "id", q => q
      .gte(LEGACY_PAGEAD_COLUMN_MAP.date, prevStartDateStr)
      .lte(LEGACY_PAGEAD_COLUMN_MAP.date, endDateStr)),
  ]);

  // 任何一张表查询失败都只是警告 + 当作那张表没有资料，不会让整个 dashboard 全部显示不出来
  const fetchErrors = [];
  if (salesErr) { console.warn(`[fetch] ${TABLE_NAME} 查询失败，Total Sales(OXM2) 这部分会是空的`, salesErr); fetchErrors.push(TABLE_NAME); }
  if (expenseErr) { console.warn(`[fetch] ${EXPENSE_TABLE_NAME} 查询失败，Ads Spend(OXM2) 这部分会是空的`, expenseErr); fetchErrors.push(EXPENSE_TABLE_NAME); }
  if (marketErr) { console.warn(`[fetch] ${MARKET_TABLE_NAME} 查询失败，OXM2 的品牌名可能会变成 Unknown`, marketErr); fetchErrors.push(MARKET_TABLE_NAME); }
  if (brandErr) { console.warn(`[fetch] ${BRAND_TABLE_NAME} 查询失败，OXM2 的品牌名可能会变成 Unknown`, brandErr); fetchErrors.push(BRAND_TABLE_NAME); }
  if (legacyOrdersErr) { console.warn(`[fetch] ${LEGACY_ORDERS_TABLE} 查询失败，Total Sales(legacy) 这部分会是空的`, legacyOrdersErr); fetchErrors.push(LEGACY_ORDERS_TABLE); }
  if (legacyProjectsErr) { console.warn(`[fetch] ${LEGACY_PROJECTS_TABLE} 查询失败，legacy 的品牌名可能会变成 Unknown`, legacyProjectsErr); fetchErrors.push(LEGACY_PROJECTS_TABLE); }
  if (legacyPageSstErr) { console.warn(`[fetch] ${LEGACY_PAGESST_TABLE} 查询失败，legacy Ads Spend 的税率会算不出来`, legacyPageSstErr); fetchErrors.push(LEGACY_PAGESST_TABLE); }
  if (legacyPageadErr) { console.warn(`[fetch] ${LEGACY_PAGEAD_TABLE} 查询失败，Ads Spend(legacy) 这部分会是空的`, legacyPageadErr); fetchErrors.push(LEGACY_PAGEAD_TABLE); }

  // 建 market_id → brand_id → brand name 的对应关系（OXM2 用），顺便记下哪些 market 是 SG（SGD 计价）
  const marketToBrandId = {};
  const sgdMarketIds = new Set();
  for (const m of (rawMarketRows || [])){
    marketToBrandId[m[MARKET_COLUMN_MAP.id]] = m[MARKET_COLUMN_MAP.brand_id];
    if ((m[MARKET_COLUMN_MAP.country] || "").toUpperCase() === "SG") sgdMarketIds.add(m[MARKET_COLUMN_MAP.id]);
  }
  const brandIdToName = {};
  for (const b of (rawBrandRows || [])) brandIdToName[b[BRAND_COLUMN_MAP.id]] = b[BRAND_COLUMN_MAP.name];
  function brandNameOf(marketId){
    const brandId = marketToBrandId[marketId];
    return (brandId && brandIdToName[brandId]) || "Unknown";
  }
  // ai_order.grand_total 在 SG market 底下是 SGD，legacy_orders 那边本来就是 MYR，不用转
  function toMYR(marketId, amount){
    return sgdMarketIds.has(marketId) ? amount * SGD_TO_MYR_RATE : amount;
  }

  // legacy_projects.id → project_name（OXM1 的「项目」名字，如果跟 ai_brand.name 同名会自动合并）
  const legacyProjectIdToName = {};
  for (const p of (rawLegacyProjects || [])) legacyProjectIdToName[p[LEGACY_PROJECT_COLUMN_MAP.id]] = canonicalizeBrandName(p[LEGACY_PROJECT_COLUMN_MAP.project_name]);

  // OXM2 的订单，归一化成统一字段名，order_no 加前缀避免跟 legacy 的 order_no 撞在一起；只留白名单里的品牌
  const oxm2Rows = (rawRows || [])
    .filter(r => !EXCLUDED_ORDER_STATUSES.includes((r[COLUMN_MAP.order_status] || "").toLowerCase()))
    .map(r => ({
      [COLUMN_MAP.order_no]: "oxm2-" + r[COLUMN_MAP.order_no],
      [COLUMN_MAP.order_date]: r[COLUMN_MAP.order_date],
      [COLUMN_MAP.grand_total]: toMYR(r[COLUMN_MAP.market_id], Number(r[COLUMN_MAP.grand_total]) || 0),
      _calendarDate: r[COLUMN_MAP.calendar_date],
      _brandName: brandNameOf(r[COLUMN_MAP.market_id]),
      _source: "oxm2",
    }))
    .filter(r => isOxm2BrandAllowed(r._brandName));

  // legacy（OXM1）的订单：按 project name 分组，只看 project_id 在 LEGACY_ALLOWED_PROJECT_IDS 白名单里的，
  // 跟 Ads Spend 用同一份名单，两边标准统一。时间用 order_date，跟 OXM2 统一口径。
  const legacyRows = (rawLegacyOrders || [])
    .filter(r => !EXCLUDED_ORDER_STATUSES.includes((r[LEGACY_ORDER_COLUMN_MAP.order_status] || "").toLowerCase()))
    .filter(r => LEGACY_ALLOWED_PROJECT_IDS.includes(Number(r[LEGACY_ORDER_COLUMN_MAP.project_id])))
    .map(r => ({
      [COLUMN_MAP.order_no]: "legacy-" + r[LEGACY_ORDER_COLUMN_MAP.order_no],
      [COLUMN_MAP.order_date]: r[LEGACY_ORDER_COLUMN_MAP.order_date],
      [COLUMN_MAP.grand_total]: r[LEGACY_ORDER_COLUMN_MAP.grand_total],
      _calendarDate: r[LEGACY_ORDER_COLUMN_MAP.calendar_date],
      _brandName: legacyProjectIdToName[r[LEGACY_ORDER_COLUMN_MAP.project_id]] || "Unknown",
      _source: "legacy",
    }));

  // Master 项目清单：ai_brand 里在 OXM2_ALLOWED_BRAND_NAMES 白名单内的品牌 + LEGACY_ALLOWED_PROJECT_IDS
  // 白名单对应的 project_name，不管这段时间有没有数据，都要出现在 dashboard 上（没数据就是 0，不是消失）
  const allBrandNames = new Set();
  for (const b of (rawBrandRows || [])){
    const n = b[BRAND_COLUMN_MAP.name];
    if (n && isOxm2BrandAllowed(n)) allBrandNames.add(n);
  }
  for (const pid of LEGACY_ALLOWED_PROJECT_IDS){
    const n = legacyProjectIdToName[pid];
    if (n) allBrandNames.add(n);
    // 白名单里的 id 在 legacy_projects 查不到名字，说明这个 project_id 在 legacy_projects 里没有对应的行——
    // 这是数据本身的问题，用 console.warn 提醒一下，方便你去数据库查
    else console.warn(`[dashboard] legacy project_id ${pid} 在 legacy_projects 里找不到对应的 project_name`);
  }
  for (const name of [...allBrandNames]) if (isExcludedBrand(name)) allBrandNames.delete(name);

  // 两个来源合并成一份，下面所有统计逻辑都不用再区分来源；顺便把排除名单里的品牌也踢掉
  const rows = [...oxm2Rows, ...legacyRows].filter(r => !isExcludedBrand(r._brandName));

  const startDateStr = toLocalDateString(CAMPAIGN_START); // 纯 DATE 字段（entry_date / legacy_pagead.date）都用日期部分比较

  // legacy Ads Spent —— 算法跟之前一样，只是税率来源从 legacy_page 换成了 legacy_pagesst：
  //   1. project 直接用 legacy_pagead.project_id → legacy_projects.project_name（不绕道 page 表）
  //   2. legacy_pagesst 按 channel_id（= page_id）+ 日期区间记录税率，找不到覆盖该日期的区间就跳过
  //      （等同 SQL 的 INNER JOIN；一个 page 可能有好几段不同税率的历史区间）
  //   3. 税率 = 0 就当 1（不调整），不是 0 就直接乘那个值
  //   4. 筛选用 LEGACY_ALLOWED_PROJECT_IDS（跟 Sales 那边同一份名单）
  const legacyPageSstPeriodsByChannel = {};
  for (const p of (rawLegacyPageSst || [])){
    const channelId = p[LEGACY_PAGESST_COLUMN_MAP.channel_id];
    (legacyPageSstPeriodsByChannel[channelId] ??= []).push({
      start: p[LEGACY_PAGESST_COLUMN_MAP.start_date],
      end: p[LEGACY_PAGESST_COLUMN_MAP.end_date],
      gst: Number(p[LEGACY_PAGESST_COLUMN_MAP.gst_tax_percentage]) || 0,
      withholding: Number(p[LEGACY_PAGESST_COLUMN_MAP.witholding_tax_percentage]) || 0,
    });
  }
  // channel_id（= page_id）+ 广告花费当天的日期，找落在哪个税率区间里。
  // 找不到覆盖当天的区间（legacy 后台税率区间维护跟不上，最新一段已经过期还没补新的）时，
  // 退回用这个渠道最近一段（哪怕已过期）的税率去估算，好过直接把这笔广告花费整笔漏算——
  // 之前就是这样漏掉的：Mformula 等好几个项目的渠道税率区间在 2026 年初就到期了，
  // 8 月的花费因为找不到精确覆盖的区间被整笔跳过，Ads Spent 少算了一大截。
  function sstTaxFor(channelId, dateStr){
    const periods = legacyPageSstPeriodsByChannel[channelId];
    if (!periods) return null;
    const exact = periods.find(p => dateStr >= p.start && dateStr <= p.end);
    if (exact) return exact;
    return periods.reduce((latest, p) => (!latest || p.end > latest.end) ? p : latest, null);
  }
  function aggregateLegacyAdsSpendByBrand(pageadRows, debugStats){
    const map = {};
    for (const ad of pageadRows){
      const projectId = ad[LEGACY_PAGEAD_COLUMN_MAP.project_id];
      if (!LEGACY_ALLOWED_PROJECT_IDS.includes(Number(projectId))){
        if (debugStats) debugStats.blockedByWhitelist[projectId] = (debugStats.blockedByWhitelist[projectId] || 0) + 1;
        continue; // project_id 白名单（统一转 Number 比对，避免字符串/数字类型对不上）
      }
      const tax = sstTaxFor(ad[LEGACY_PAGEAD_COLUMN_MAP.page_id], ad[LEGACY_PAGEAD_COLUMN_MAP.date]);
      if (!tax){
        if (debugStats) debugStats.blockedByMissingPage[ad[LEGACY_PAGEAD_COLUMN_MAP.page_id]] = (debugStats.blockedByMissingPage[ad[LEGACY_PAGEAD_COLUMN_MAP.page_id]] || 0) + 1;
        continue; // 找不到覆盖该日期的税率区间，等同 SQL 的 INNER JOIN 筛掉
      }
      const gstMult = tax.gst === 0 ? 1 : tax.gst;
      const whMult = tax.withholding === 0 ? 1 : tax.withholding;
      const spend = (Number(ad[LEGACY_PAGEAD_COLUMN_MAP.fb_ad_cost_spent]) || 0) * gstMult * whMult;
      const brand = legacyProjectIdToName[projectId] || "Unknown";
      if (isExcludedBrand(brand)) continue;
      map[brand] = (map[brand] || 0) + spend;
      if (debugStats) debugStats.included++;
    }
    return map;
  }
  const currentLegacyPagead = (rawLegacyPagead || []).filter(ad => ad[LEGACY_PAGEAD_COLUMN_MAP.date] >= startDateStr);
  const prevLegacyPagead = (rawLegacyPagead || []).filter(ad => ad[LEGACY_PAGEAD_COLUMN_MAP.date] < startDateStr);

  // 汇总诊断：这次刷新总共有几笔 legacy_pagead 落在日期范围内、被白名单挡了几笔（挡了哪些 project_id）、
  // 找不到 page 税率被挡了几笔（挡了哪些 page_id）、最后真的算进去了几笔
  const legacyAdsDebug = { included: 0, blockedByWhitelist: {}, blockedByMissingPage: {} };
  const currentLegacyAdsByBrand = aggregateLegacyAdsSpendByBrand(currentLegacyPagead, legacyAdsDebug);
  const prevLegacyAdsByBrand = aggregateLegacyAdsSpendByBrand(prevLegacyPagead);
  console.log(`[legacy ads] 日期范围内共 ${currentLegacyPagead.length} 笔 pagead，算进去 ${legacyAdsDebug.included} 笔`);
  if (Object.keys(legacyAdsDebug.blockedByWhitelist).length){
    console.log("[legacy ads] 被 project_id 白名单挡掉（project_id → 被挡笔数）:", legacyAdsDebug.blockedByWhitelist);
  }
  if (Object.keys(legacyAdsDebug.blockedByMissingPage).length){
    console.log("[legacy ads] 找不到对应 page 税率被挡掉（page_id → 被挡笔数）:", legacyAdsDebug.blockedByMissingPage);
  }

  // 补录挡掉：created_at/created_datetime 落在区间内不够——如果这笔单是「今天才补录进系统、
  // 但订单实际发生在前几天」的旧单（order_date 的日历日不在这个区间跨的那几天里），也要挡掉，
  // 不然一次批量补录就会把好几天前的旧单全部算进当前这个区间的 Total Sales 里。
  function calendarDateInWindow(rawDate, windowStart, windowEnd){
    if (!rawDate) return false;
    const d = new Date(rawDate);
    const lower = new Date(windowStart.getFullYear(), windowStart.getMonth(), windowStart.getDate());
    const upperExclusive = new Date(windowEnd.getFullYear(), windowEnd.getMonth(), windowEnd.getDate() + 1);
    return d >= lower && d < upperExclusive;
  }
  // 拉资料时把上限放宽到了 fetchEndExclusive（盖住 ILady 多出来的 30 分钟），
  // 所以这里一定要按每一行自己的品牌重新卡回真正该用的上限——ILady 用 13:30，
  // 其他项目用回 13:00，不然 fetch 放宽出来的那 30 分钟会把别的项目也一起多算进去。
  const currentRows = rows.filter(r => {
    const rowEnd = r._brandName === "ILady" ? ILADY_EXTENDED_END : endExclusive;
    const d = new Date(r[COLUMN_MAP.order_date]);
    return d >= startDate && d < rowEnd && calendarDateInWindow(r._calendarDate, startDate, rowEnd);
  });
  const prevRows = rows.filter(r => new Date(r[COLUMN_MAP.order_date]) < startDate
    && calendarDateInWindow(r._calendarDate, prevStart, startDate));

  const availableBrands = [...allBrandNames].sort();

  const filteredCurrentRows = filters.project === "all" ? currentRows : currentRows.filter(r => r._brandName === filters.project);
  const filteredPrevRows = filters.project === "all" ? prevRows : prevRows.filter(r => r._brandName === filters.project);

  // active/idle：品牌在筛选范围内「最近一天」有没有单，不是写死的
  const latestDay = filteredCurrentRows.length
    ? filteredCurrentRows.reduce((max, r) => {
        const d = toLocalDateString(new Date(r[COLUMN_MAP.order_date]));
        return d > max ? d : max;
      }, "0000-00-00")
    : null;
  const activeBrandsToday = new Set(
    filteredCurrentRows
      .filter(r => toLocalDateString(new Date(r[COLUMN_MAP.order_date])) === latestDay)
      .map(r => r._brandName)
  );

  const expenseRows = (rawExpenseRows || [])
    .map(r => ({ ...r, _brandName: brandNameOf(r[EXPENSE_COLUMN_MAP.market_id]) }))
    .filter(r => !isExcludedBrand(r._brandName))
    .filter(r => isOxm2BrandAllowed(r._brandName));
  const currentExpenseRows = expenseRows.filter(r => r[EXPENSE_COLUMN_MAP.entry_date] >= startDateStr);
  const prevExpenseRows = expenseRows.filter(r => r[EXPENSE_COLUMN_MAP.entry_date] < startDateStr);

  // OXM2（ai_expenses_entry）+ legacy（legacy_pagead）两边都已经按日期拆好了，直接合并
  const currentAdsByBrand = mergeAdsSpend(aggregateAdsSpendByBrand(currentExpenseRows), currentLegacyAdsByBrand);
  const prevAdsByBrand = mergeAdsSpend(aggregateAdsSpendByBrand(prevExpenseRows), prevLegacyAdsByBrand);

  // 大盘 Ads Spend：project=all 时 sum 全部品牌；筛了某个项目就只算那个品牌
  const overallCurrentAds = filters.project === "all"
    ? Object.values(currentAdsByBrand).reduce((a,v)=>a+v,0)
    : (currentAdsByBrand[filters.project] || 0);
  const overallPrevAds = filters.project === "all"
    ? Object.values(prevAdsByBrand).reduce((a,v)=>a+v,0)
    : (prevAdsByBrand[filters.project] || 0);

  const overallToday = aggregateOverall(filteredCurrentRows, overallCurrentAds);
  // 大盘总数也要加上手动加的那几笔，不然最上面的 GMV 会比下面 table 加总起来的还少
  if (filters.project === "all"){
    overallToday.total_sales += Object.values(MANUAL_SALES_ADJUSTMENTS).reduce((a,v)=>a+v,0);
  } else if (MANUAL_SALES_ADJUSTMENTS[filters.project]){
    overallToday.total_sales += MANUAL_SALES_ADJUSTMENTS[filters.project];
  }
  const overallYesterday = aggregateOverall(filteredPrevRows, overallPrevAds);

  const currentByBrand = aggregateByBrand(filteredCurrentRows);
  const prevByBrand = aggregateByBrand(filteredPrevRows);
  const currentBrandMap = Object.fromEntries(currentByBrand.map(b => [b.project_name, b]));
  const prevBrandMap = Object.fromEntries(prevByBrand.map(b => [b.project_name, b]));

  // 遍历 master 清单（而不是只遍历「这段时间有数据」的品牌），保证没数据的项目也会显示出来，值是 0
  const projectNamesToShow = filters.project === "all" ? [...allBrandNames] : [filters.project];
  const projects = projectNamesToShow.map(name => {
    const b = { ...(currentBrandMap[name] || { project_name: name, total_sales: 0, total_orders: 0, aov: 0, status: "active" }) };
    if (MANUAL_SALES_ADJUSTMENTS[name]) b.total_sales += MANUAL_SALES_ADJUSTMENTS[name]; // 手动加的，不对应订单
    const y = prevBrandMap[name];
    const adsSpent = currentAdsByBrand[name] || 0;
    const prevAdsSpent = prevAdsByBrand[name] || 0;
    const roas = adsSpent > 0 ? +(b.total_sales / adsSpent).toFixed(2) : null;
    const prevRoas = (y && prevAdsSpent > 0) ? +(y.total_sales / prevAdsSpent).toFixed(2) : null;
    return {
      ...b,
      project_name: name,
      project_type: classifyBrand(name),
      ads_spent: adsSpent,
      roas,
      status: activeBrandsToday.has(name) ? "active" : "idle",
      prev_total_sales: y ? y.total_sales : null, // 排名涨跌用，不是百分比而是原始值，才能重建上一期的名次
      trends: {
        ads_spent:    pct(adsSpent, prevAdsSpent),
        total_sales:  pct(b.total_sales, y ? y.total_sales : null),
        roas:         pct(roas, prevRoas),
        aov:          pct(b.aov, y ? y.aov : null),
        total_orders: pct(b.total_orders, y ? y.total_orders : null),
      },
    };
  });

  return { overallToday, overallYesterday, projects, availableBrands, fetchErrors, series: buildDailySeries(filteredCurrentRows) };
}

/** 按本地日期把选中范围内的销售额加总，给 Hero 卡右边的迷你趋势图用 */
function buildDailySeries(rows){
  const byDay = new Map();
  for (const r of rows){
    const day = toLocalDateString(new Date(r[COLUMN_MAP.order_date]));
    byDay.set(day, (byDay.get(day) || 0) + (Number(r[COLUMN_MAP.grand_total]) || 0));
  }
  return [...byDay.entries()].sort((a,b) => a[0].localeCompare(b[0])).map(([date, total_sales]) => ({ date, total_sales }));
}

// 把 OXM2（ai_expenses_entry）跟 legacy（page × 税率）两份 Ads Spend 按品牌名合并成一份
function mergeAdsSpend(...dicts){
  const out = {};
  for (const d of dicts){
    for (const brand in d){
      out[brand] = (out[brand] || 0) + d[brand];
    }
  }
  return out;
}

// 把 ai_expenses_entry 的 Ads Spend 行按品牌（通过 market → brand 换算出来的）汇总
function aggregateAdsSpendByBrand(rows){
  const map = {};
  for (const r of rows){
    const brand = r._brandName || "Unknown";
    map[brand] = (map[brand] || 0) + expenseAmount(r);
  }
  return map;
}

// 把一批订单行按品牌（通过 market → brand 换算出来的）汇总成「项目」
function aggregateByBrand(rows){
  const map = {};
  for (const r of rows){
    const brand = r._brandName || "Unknown";
    if (!map[brand]) map[brand] = { project_name: brand, total_sales:0, orderSet:new Set() };
    map[brand].total_sales += Number(r[COLUMN_MAP.grand_total]) || 0;
    map[brand].orderSet.add(r[COLUMN_MAP.order_no]);
  }
  return Object.values(map).map(m => ({
    project_name: m.project_name,
    total_sales: +m.total_sales.toFixed(2),
    total_orders: m.orderSet.size,
    aov: m.orderSet.size ? +(m.total_sales / m.orderSet.size).toFixed(2) : 0,
    status: "active",
  }));
}

// 大盘 KPI：sum 选中日期范围内的所有订单 + 对应的 Ads Spend
function aggregateOverall(rows, adsSpent){
  const sales = rows.reduce((a,r)=> a + (Number(r[COLUMN_MAP.grand_total]) || 0), 0);
  const orderSet = new Set(rows.map(r => r[COLUMN_MAP.order_no]));
  return {
    total_sales: +sales.toFixed(2),
    ads_spent: +Number(adsSpent || 0).toFixed(2),
    roas: adsSpent > 0 ? +(sales/adsSpent).toFixed(2) : null,
    aov: orderSet.size ? +(sales/orderSet.size).toFixed(2) : 0,
    total_orders: orderSet.size,
  };
}

function kpiCardHTML(def, cur, prev){

    </div>`;
}
/** Hero 卡右边的迷你趋势图：面积图，只示意走势，不带坐标轴 */
function sparklineSVG(series){
  const w = 260, h = 88;
  if (!series || series.length < 2){
    // 数据点不够画不出真实趋势线（比如只看「今天」），放一个装饰性的折线图标，不要留白
    return `
      <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="opacity:0.35">
        <polyline points="20,64 70,44 110,54 150,28 190,36 240,16" fill="none" stroke="var(--blue-bright)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="240" cy="16" r="5" fill="var(--blue-bright)"/>
      </svg>`;
  }
  const values = series.map(d => d.total_sales);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const stepX = w / (values.length - 1);
  const points = values.map((v,i) => [i * stepX, h - ((v - min) / range) * (h - 10) - 5]);
  const linePath = points.map((p,i) => (i===0 ? `M${p[0].toFixed(1)},${p[1].toFixed(1)}` : `L${p[0].toFixed(1)},${p[1].toFixed(1)}`)).join(" ");
  const areaPath = `${linePath} L${w},${h} L0,${h} Z`;
  return `
    <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" style="stop-color:var(--blue-bright); stop-opacity:0.45"/>
          <stop offset="100%" style="stop-color:var(--blue-bright); stop-opacity:0"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#sparkFill)" stroke="none"/>
      <path d="${linePath}" fill="none" stroke="var(--blue-bright)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
}
function renderKPIGrid(today, yesterday, series){
  const [heroDef, ...restDefs] = KPI_DEFS;

  // Hero 卡：Total Sales，放大展示，白到蓝的渐变字，右边配一个迷你趋势图
  const heroCur = today[heroDef.key], heroPrev = yesterday[heroDef.key];
  const heroChange = pct(heroCur, heroPrev);
  const ht = trendMeta(heroChange);
  document.getElementById("kpiHero").innerHTML = `
    <div class="flex items-center gap-6">
      <div class="min-w-0 shrink-0">
        <p class="eyebrow mb-1">${heroDef.label}</p>
        <p class="kpi-val gmv-value font-extrabold whitespace-nowrap">${fmtValue(heroCur, heroDef.fmt)}</p>
        <p class="text-sm -mt-0.5 ${ht.cls} font-mono">${ht.icon} ${ht.text} <span class="text-[color:var(--text-low)] font-sans">vs 上期 previous period</span></p>
      </div>
      <div class="hidden sm:block flex-1 min-w-0">${sparklineSVG(series)}</div>
    </div>
  `;

  const grid = document.getElementById("kpiGrid");
  grid.innerHTML = restDefs.map(def => kpiCardHTML(def, today[def.key], yesterday[def.key])).join("");
}

/* ---------------------------------------------------------------------
   RENDER: RANKINGS — 内外部合并成一个总榜，按名次涨跌显示 ▲/▼/NEW/—
--------------------------------------------------------------------- */
function rankBadgeClass(i){
  if (i===0) return "rank-1"; if (i===1) return "rank-2"; if (i===2) return "rank-3"; return "rank-n";
}
/** 名次涨跌：跟上一期（等长的上一个周期）比，name 对不上就是本期新上榜 NEW */
function rankMovement(currentRank, prevRank){
  if (prevRank == null) return { text: "NEW", cls: "up" };
  const delta = prevRank - currentRank;
  if (delta > 0) return { text: `▲${delta}`, cls: "up" };
  if (delta < 0) return { text: `▼${Math.abs(delta)}`, cls: "down" };
  return { text: "—", cls: "flat" };
}
/** 算出本期名次 + 上一期名次（上一期名次只在有过销售的项目里排，没有的当 NEW） */
function withRankMovement(projects){
  const ranked = [...projects].sort((a,b) => b.total_sales - a.total_sales);
  const prevRanked = projects
    .filter(p => p.prev_total_sales)
    .sort((a,b) => b.prev_total_sales - a.prev_total_sales);
  const prevRankByName = {};
  prevRanked.forEach((p,i) => { prevRankByName[p.project_name] = i + 1; });
  return ranked.map((p,i) => ({ ...p, _rank: i + 1, _prevRank: prevRankByName[p.project_name] ?? null }));
}
/** Y 轴刻度：整数步长（1/2/5×10^n），从 0 数到刚好盖过数据最大值 */
/** 排行榜：不做坐标轴，纯设计向的柱子——铺满整个面板高度，No.1 用更亮的渐变 + 光晕突出 */
function renderGrandLeaderboard(projects){
  const top5 = withRankMovement(projects).slice(0, 5);
  const maxSales = top5[0]?.total_sales || 1;

  document.getElementById("rankTop5").innerHTML = top5.length ? `
    <div class="grid grid-cols-5 gap-3 h-full items-end">
      ${top5.map((p, i) => {
        const barPct = Math.max(16, Math.min(100, (p.total_sales / maxSales) * 100));
        const isFirst = i === 0;
        const barGradient = isFirst
          ? "linear-gradient(180deg, #cfe4ff, var(--blue-bright) 55%, var(--blue-deep))"
          : "linear-gradient(180deg, var(--blue-bright), var(--blue-deep))";
        const glow = isFirst ? "box-shadow: 0 0 24px -4px rgba(156,196,255,0.85);" : "";
        const mv = rankMovement(p._rank, p._prevRank);
        return `
          <div class="flex flex-col items-center text-center h-full">
            <div class="flex items-center justify-center gap-1.5">
              <div class="rank-badge ${rankBadgeClass(i)}" style="width:26px;height:26px;font-size:13px;">${i + 1}</div>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${mv.cls}" style="background:rgba(255,255,255,0.06);">${mv.text}</span>
            </div>
            <p class="font-mono text-base font-bold truncate w-full mt-1.5" style="color:var(--text-hi)">${fmtValue(p.total_sales,"currency")}</p>
            <div class="flex-1 w-full flex items-end mt-2 flash-update">
              <div class="w-full rounded-t-lg" style="height:${barPct}%; min-height:20px; background:${barGradient}; ${glow}"></div>
            </div>
            <p class="text-xs font-semibold truncate w-full mt-2" title="${maskName(p.project_name)}">${maskName(p.project_name)}</p>
            <p class="text-[10px] truncate w-full" style="color:var(--text-low)">${fmtValue(p.total_orders,"int")} orders</p>
          </div>`;
      }).join("")}
    </div>` : `<p class="text-sm text-[color:var(--text-mid)]">暂无数据</p>`;
}

/* ---------------------------------------------------------------------
   RENDER: PROJECT TABLE — 可点击表头排序，每个数值列下面带 vs previous period 的 %
--------------------------------------------------------------------- */
const TABLE_COLUMNS = [
  { key: "project_name", label: "Project",     sortable: true,  numeric: false },
  { key: "ads_spent",    label: "Ads Spent",   sortable: true,  numeric: true, fmt: "currency" },
  { key: "total_sales",  label: "Total Sales", sortable: true,  numeric: true, fmt: "currency" },
  { key: "roas",         label: "ROME",        sortable: true,  numeric: true, fmt: "ratio" },
  { key: "aov",          label: "AOV",         sortable: true,  numeric: true, fmt: "currency" },
  { key: "total_orders", label: "Orders",      sortable: true,  numeric: true, fmt: "int" },
  { key: "status",       label: "Status",      sortable: false, numeric: false },
];

let tableSortState = { key: "total_sales", dir: "desc" };
let lastProjects = []; // 缓存最近一次拿到的数据，点表头排序 / 翻页时不用重新拉取
let tableCurrentPage = 1;
const TABLE_PAGE_SIZE = 15;

function renderTableHead(){
  const head = document.getElementById("perfTableHead");
  head.innerHTML = TABLE_COLUMNS.map(col => {
    const isActive = tableSortState.key === col.key;
    const arrow = isActive ? (tableSortState.dir === "asc" ? "▲" : "▼") : "";
    const cls = col.sortable ? "py-1.5 pr-4 sort-th" : "py-1.5 pr-4";
    return `<th class="${cls}" data-key="${col.key}">${col.label} <span style="color:var(--blue-bright)">${arrow}</span></th>`;
  }).join("");

  head.querySelectorAll(".sort-th").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (tableSortState.key === key){
        tableSortState.dir = tableSortState.dir === "asc" ? "desc" : "asc";
      } else {
        tableSortState = { key, dir: "desc" };
      }
      tableCurrentPage = 1; // 换排序标准，回到第一页
      renderTableHead();
      renderTable(lastProjects, false);
    });
  });
}

function trendSpanHTML(trendPct){
  const t = trendMeta(trendPct);
  return `<span class="cell-trend ${t.cls}">${t.icon} ${t.text}</span>`;
}

function renderTable(projects, cache = true){
  if (cache){ lastProjects = projects; tableCurrentPage = 1; } // 新数据进来，回到第一页
  const body = document.getElementById("perfTableBody");

  const { key, dir } = tableSortState;
  const sorted = [...projects].sort((a,b) => {
    let av = a[key], bv = b[key];
    if (typeof av === "string" || typeof bv === "string"){
      av = (av ?? "").toString().toLowerCase(); bv = (bv ?? "").toString().toLowerCase();
      return dir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    av = av ?? -Infinity; bv = bv ?? -Infinity;
    return dir === "asc" ? av - bv : bv - av;
  });

  const totalPages = Math.max(1, Math.ceil(sorted.length / TABLE_PAGE_SIZE));
  if (tableCurrentPage > totalPages) tableCurrentPage = totalPages;
  const startIdx = (tableCurrentPage - 1) * TABLE_PAGE_SIZE;
  const pageRows = sorted.slice(startIdx, startIdx + TABLE_PAGE_SIZE);

  body.innerHTML = pageRows.map(p => `
    <tr>
      <td class="py-1 pr-4">
        <span class="font-medium">${maskName(p.project_name)}</span>
      </td>
      <td class="py-1 pr-4 font-mono">
        ${fmtValue(p.ads_spent,"currency")}
        ${trendSpanHTML(p.trends?.ads_spent)}
      </td>
      <td class="py-1 pr-4 font-mono font-semibold">
        ${fmtValue(p.total_sales,"currency")}
        ${trendSpanHTML(p.trends?.total_sales)}
      </td>
      <td class="py-1 pr-4 font-mono">
        ${fmtValue(p.roas,"ratio")}
        ${trendSpanHTML(p.trends?.roas)}
      </td>
      <td class="py-1 pr-4 font-mono">
        ${fmtValue(p.aov,"currency")}
        ${trendSpanHTML(p.trends?.aov)}
      </td>
      <td class="py-1 pr-4 font-mono">
        ${fmtValue(p.total_orders,"int")}
        ${trendSpanHTML(p.trends?.total_orders)}
      </td>
      <td class="py-1 pr-4">
        <span class="status-dot status-${p.status||'active'}"></span>
        <span class="text-xs capitalize">${p.status||'active'}</span>
      </td>
    </tr>`).join("")
    // 最后一页凑不满 TABLE_PAGE_SIZE 行时，用空行占位撑高度，
    // 这样每一页的高度都一样，fitToScreen 算出来的缩放比例才不会跟着翻页跳动
    + `<tr class="invisible"><td class="py-1" colspan="7">&nbsp;</td></tr>`.repeat(Math.max(0, TABLE_PAGE_SIZE - pageRows.length));

  renderPagination(sorted.length, totalPages);
}

function renderPagination(totalRows, totalPages){
  const summary = document.getElementById("pageSummary");
  const buttons = document.getElementById("pageButtons");
  const startIdx = totalRows === 0 ? 0 : (tableCurrentPage - 1) * TABLE_PAGE_SIZE + 1;
  const endIdx = Math.min(tableCurrentPage * TABLE_PAGE_SIZE, totalRows);
  summary.textContent = totalRows === 0 ? "" : `${startIdx}-${endIdx} / ${totalRows}`;

  const pageBtn = (label, page, { disabled = false, active = false } = {}) =>
    `<button class="page-btn ${active ? "active" : ""}" data-page="${page}" ${disabled ? "disabled" : ""}>${label}</button>`;

  const windowSize = 5;
  let from = Math.max(1, tableCurrentPage - Math.floor(windowSize / 2));
  let to = Math.min(totalPages, from + windowSize - 1);
  from = Math.max(1, to - windowSize + 1);

  let html = pageBtn("&laquo;", tableCurrentPage - 1, { disabled: tableCurrentPage <= 1 });
  for (let i = from; i <= to; i++) html += pageBtn(String(i), i, { active: i === tableCurrentPage });
  html += pageBtn("&raquo;", tableCurrentPage + 1, { disabled: tableCurrentPage >= totalPages });
  buttons.innerHTML = html;

  buttons.querySelectorAll(".page-btn:not(:disabled)").forEach(btn => {
    btn.addEventListener("click", () => {
      tableCurrentPage = Number(btn.dataset.page);
      renderTable(lastProjects, false);
    });
  });
}

/* ---------------------------------------------------------------------
   MAIN REFRESH CYCLE
--------------------------------------------------------------------- */
// 每次刷新发一个 token 出去，只有「当前最新的那一次」有资格把结果画到画面上——
// 避免自动刷新重叠触发时，先发出去的请求晚回来反而把新结果盖掉
let latestRefreshToken = 0;
function fmtPeriodDate(dateStr){
  const [y, m, d] = dateStr.split("-").map(Number);
  const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  return `${String(d).padStart(2,"0")} ${months[m-1]}`;
}
async function refreshDashboard(){
  const myToken = ++latestRefreshToken;
  try{
    const data = await fetchDashboardData(currentFilters);
    if (myToken !== latestRefreshToken) return; // 这期间已经有更新的刷新发生了，这次的结果作废，不画
    renderKPIGrid(data.overallToday, data.overallYesterday, data.series);
    renderRankingSection(data.projects);
    renderTable(data.projects);
    document.getElementById("periodLabel").textContent =
      `${fmtPeriodDate(toLocalDateString(CAMPAIGN_START))} – ${fmtPeriodDate(toLocalDateString(CAMPAIGN_END))}`;
    document.getElementById("fetchErrorBanner").textContent =
      (data.fetchErrors && data.fetchErrors.length) ? `⚠ 查询失败: ${data.fetchErrors.join(", ")}（看 Console 详情）` : "";
    document.getElementById("lastRefresh").textContent = new Date().toLocaleTimeString("en-MY", {hour12:false});
    fitToScreen(); // 只在整批数据刷新完、表格回到第 1 页（行数固定）时重新量一次，翻页本身不应该改变缩放比例
  }catch(err){
    if (myToken !== latestRefreshToken) return; // 同上，旧请求的报错也不该覆盖新请求的状态
    console.error(err);
    document.getElementById("lastRefresh").textContent = "Error — see console";
  }
}

// BRAND_TYPE_MAP 是空的时候，先合并显示一个总排名；
// 等你把 internal/external 规则发我填进 BRAND_TYPE_MAP，会自动变回左右两栏
function renderRankingSection(projects){
  renderGrandLeaderboard(projects);
}

/* ---------------------------------------------------------------------
   CLOCK + AUTO REFRESH（每 10 分钟静默刷新一次，不在界面上显示倒数）
   时钟显示跟资料刷新用两个独立的计时器，资料刷新直接用 setInterval 定时触发，
   不靠「每秒累加到 N 次」这种写法——分页被浏览器丢到背景时更不容易被卡住
--------------------------------------------------------------------- */
function updateClock(){
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-MY", {hour12:false});
}

/** 把整个（固定 1920 宽设计的）dashboard 缩放铺满实际窗口（宽高分开算比例，贴边不留黑边），
 *  不管真实屏幕/浏览器窗口多高多宽，都保证整页可见、不出现 scroll、内容也不会被裁掉看不到 */
function fitToScreen(){
  const root = document.getElementById("dashboardRoot");
  root.style.transform = "scale(1, 1)";
  const naturalWidth = root.scrollWidth;
  const naturalHeight = root.scrollHeight;
  const scaleX = window.innerWidth / naturalWidth;
  const scaleY = window.innerHeight / naturalHeight;
  root.style.transform = `scale(${scaleX}, ${scaleY})`;
  root.style.transformOrigin = "top left";
  root.style.left = "0px";
  root.style.top = "0px";
}

/** 自动侦测部署了新版本、整页自动刷新，不用每台电视/屏幕都手动去按 F5。
 *  定期问一下服务器这个页面现在的 Last-Modified/ETag 是多少，跟第一次打开时记下来的不一样，
 *  说明代码已经更新（推了新的 commit），直接整页 reload 拿新代码，不用等人手动刷新。
 *  优先用 Last-Modified（Vercel 正式环境有），没有的话退回用 ETag（本地 `serve` 只有这个）。 */
let pageVersionTag = null;
async function checkForNewVersion(){
  try{
    const res = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    const tag = res.headers.get("last-modified") || res.headers.get("etag");
    if (!tag) return;
    if (pageVersionTag === null){ pageVersionTag = tag; return; }
    if (tag !== pageVersionTag) location.reload();
  }catch(err){
    console.warn("[version check] 查询失败，先跳过这一次", err);
  }
}

/* ---------------------------------------------------------------------
   INIT
--------------------------------------------------------------------- */
window.addEventListener("DOMContentLoaded", () => {
  if (DEMO_MODE){
    const banner = document.createElement("div");
    banner.className = "mx-4 mt-4 mb-0 text-xs text-center py-2 rounded-lg";
    banner.style.cssText = "background:rgba(79,155,245,0.1); border:1px solid rgba(79,155,245,0.3); color:var(--blue-bright)";
    banner.textContent = "⚠ DEMO MODE — 尚未连接 Supabase，当前展示的是示例数据。请在 index.html 顶部 CONFIG 里填入 SUPABASE_URL 和 SUPABASE_ANON_KEY。";
    document.body.insertBefore(banner, document.body.firstChild.nextSibling);
  }
  renderTableHead();
  refreshDashboard();
  fitToScreen();
  checkForNewVersion(); // 先记一次当前版本，之后才有东西可以比对
  setInterval(updateClock, 1000);
  setInterval(refreshDashboard, CONFIG.REFRESH_INTERVAL_MS);
  setInterval(checkForNewVersion, CONFIG.REFRESH_INTERVAL_MS);
  window.addEventListener("resize", fitToScreen);

  // 分页从背景（切到别的分页 / 螢幕休眠）切回来的时候，强制刷新一次，
  // 避免离开画面太久、回来看到的还是很旧的资料
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refreshDashboard();
  });
});
</script>
